[build.environment]
  # Firebase web (client) config values are public by design: Next.js inlines
  # NEXT_PUBLIC_* variables into the bundles at build time. Exclude them from
  # secrets scanning so the build doesn't fail. Real secrets (FIREBASE_PRIVATE_KEY,
  # FIREBASE_CLIENT_EMAIL, OWNER_*) are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID"
